name: Ad-hoc release (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version, without v (MAJOR.MINOR.PATCH)
        required: true
        type: string
      build:
        description: Increasing positive integer build number
        required: true
        type: string
      publish:
        description: Create a draft GitHub Release for an existing main tag (all gates required)
        type: boolean
        default: false
      allow_known_v8_failure:
        description: Apply the recorded owner-approved V8 exception for v1.0.1 only (all other gates required)
        type: boolean
        default: false
      existing_tag:
        description: Publication only - existing vVERSION tag at the selected main commit
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify visibility before using a macOS runner
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$ ]]
          [[ "$BUILD" =~ ^[1-9][0-9]{0,8}$ ]]
          visibility=$(gh api "repos/$REPOSITORY" --jq .visibility)
          if [[ "$visibility" != public ]]; then
            echo 'Private repository: stop and review plan, minutes, storage and budget before adapting this workflow.' >&2
            exit 1
          fi

  package:
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out selected commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publication must refer to an existing tag at this main commit
        if: inputs.publish
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.existing_tag }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$TAG" = "v$VERSION"
          test "$(git rev-parse --verify "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
      - name: Fail fast on app/toolchain incompatibility
        run: |
          make build
          make build-release
      - name: Canonical gates, universal archive and DMG/ZIP round-trips
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          ALLOW_V8: ${{ inputs.allow_known_v8_failure }}
        run: |
          args=("$VERSION" "$BUILD")
          if [[ "$ALLOW_V8" == true ]]; then
            args+=(--allow-known-v8-failure)
          fi
          scripts/release.sh "${args[@]}"
      - name: Upload verified dry-run package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: petscape-release
          path: |
            dist/release/*/*.zip
            dist/release/*/*.dmg
            dist/release/*/*.sha256
            dist/release/*/SHA256SUMS
            dist/release/*/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 7
      - name: Retain gate evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: petscape-release-logs
          path: dist/release/*/logs/
          if-no-files-found: warn
          retention-days: 7

  publish:
    if: inputs.publish
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download this run's verified package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: petscape-release
          path: release-artifacts
      - name: Verify checksum and create draft (never create a tag)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          TAG: ${{ inputs.existing_tag }}
          REPOSITORY: ${{ github.repository }}
        working-directory: release-artifacts
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$TAG" = "v$VERSION"
          test "$(gh api "repos/$REPOSITORY/commits/$TAG" --jq .sha)" = "$GITHUB_SHA"
          cd "PetScape-$VERSION-$BUILD-universal"
          sha256sum -c SHA256SUMS
          gh release create "$TAG" --repo "$REPOSITORY" --verify-tag --draft \
            --title "PetScape $VERSION" --notes-file RELEASE-NOTES.md \
            -- "PetScape-$VERSION-$BUILD-universal.dmg" "PetScape-$VERSION-$BUILD-universal.zip" \
            "PetScape-$VERSION-$BUILD-universal.dmg.sha256" "PetScape-$VERSION-$BUILD-universal.zip.sha256" \
            SHA256SUMS RELEASE-NOTES.md
